<loading/>

<div class="edit-course-form" [formGroup]="editCourseDialogueForm">

  <h3>{{ data.title }}</h3>

  <div class="form-control">
    <label for="title">Название курса:</label>
    <input placeholder="Введи название"
           formControlName="title"
           type="text"
           id="title">
  </div>

  <div class="form-control">
    <label for="longDescription">Описание курса:</label>
    <textarea placeholder="Введи описание"
              formControlName="longDescription"
              id="longDescription">
    </textarea>
  </div>

  <!-- <div class="form-control">
    <label>Категория:</label>
    <select formControlName="category">
      <option value="BEGINNER">Начальные</option>
      <option value="INTERMEDIATE">Средние</option>
      <option value="ADVANCED">Продвинутые</option>
    </select>
  </div> -->

  <course-category-combobox 
           [control]="editCourseDialogueForm.controls['category']" 
           label="Категория:"
           [(value)]="category">
  </course-category-combobox>

  <div class="form-control">
    <label for="iconUrl">Картинка курса:</label>
    <input placeholder="Введи адрес картинки"
           formControlName="iconUrl"
           type="url"
           id="iconUrl">
  </div>

  <div class="form-actions">

    <button class="btn" (click)="onSave()" >
      Save
    </button>

    <button class="btn" (click)="onCancel()">
      Cancel
    </button>

  </div>

</div>
