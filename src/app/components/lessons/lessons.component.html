<div class="lessons">

    @if (mode() === 'master') 
    {
        <div class="header">
            <h1>Искать уроки</h1>
            <div class="form-control search-controls">
                <input type="text" placeholder="Искать уроки"
                    (keyup.enter)="onSearch()" #searchInput />
                <button class="search btn" (click)="onSearch()">Поиск</button>
            </div>  
        </div>

        @if (lessons().length > 0) {
            <div class="table-container">
                <table class="results-table">
                    @for (lesson of lessons(); track lesson.id) {
                        <tr (click)="onLessonSelected(lesson)" >
                            <td>
                                {{lesson.description}}
                            </td>
                            <td>
                                {{lesson.duration}}
                            </td>
                        </tr>
                    }
                </table>
            </div>
        }
        
    }

    @else {
       <lesson-detail [lesson]="selectedLesson()" (cancel)="onCancel()" (lessonUpdated)="onLessonUpdated($event)"/>
    }

</div>
