<div class="lesson-detail">

  <h1>Редактировать урок</h1>

  <div class="form-control edit-lesson">
    <label for="lesson">Описание урока:</label>
    <input placeholder="Enter course title" #lessonDescriptionInput
      [value]="lesson()?.description" id="lesson" type="text" />
  </div>

</div>

<div class="form-actions">

  <button class="btn" (click)="onSave()">
    Save
  </button>

  <button class="btn" (click)="onCancel()">
    Cancel
  </button>

</div>
